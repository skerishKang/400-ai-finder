name: MVP Contract Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run MVP contract pytest suite
        run: |
          python -m pytest -q \
            tests/test_mvp_failure_codes.py \
            tests/test_mobile_demo.py \
            tests/test_citizen_first_use_shell.py \
            tests/test_citizen_sitespec_parity.py \
            tests/test_citizen_action_demo_chat_shell_contract.py \
            tests/test_citizen_action_demo_canvas.py \
            tests/test_shared_runtime_vocabulary_contract.py

      - name: Run legacy requests transport contract tests
        run: python -m pytest -q tests/test_legacy_requests_transport.py

      - name: Run legacy crawler fallback contract suites
        run: |
          python -m pytest -q \
            tests/test_url_crawler.py \
            tests/test_homepage_mapper.py

      - name: Run acquisition-scope contract suites (#1294)
        run: |
          python -m pytest -q \
            tests/test_egress_policy.py \
            tests/test_fetch_providers.py \
            tests/test_document_enricher.py \
            tests/test_pipeline_runner.py \
            tests/test_site_profile.py

  snapshot-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run canonical official snapshot contracts
        run: |
          python -m pytest -q \
            tests/test_bukgu_official_apartment_snapshot.py \
            tests/test_bukgu_official_content_snapshots.py \
            tests/test_renderer_route_manifest_fidelity.py \
            tests/test_capture_required_entry_spec.py \
            tests/test_exact_official_site_clone_invariant.py \
            tests/test_bukgu_quest_schema.py \
            tests/test_bukgu_quest_to_action_plan.py \
            tests/test_mvp_golden_quest_fidelity_matrix.py \
            tests/test_reference_capture_contract.py \
            tests/test_reference_capture_artifact_integrity.py \
            tests/test_reference_clone_model.py
          node --test tests/functions/test_named_site_reference_capture_contract.mjs

      - name: Run Buk-gu golden docs contract (#1188)
        run: python -m pytest -q tests/test_bukgu_golden_docs_contract.py

  site-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run site adapter contract matrix (#1221)
        run: python -m pytest -q tests/test_site_adapter_contract_matrix.py

  build-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run static Pages build contract tests
        run: python -m pytest -q tests/test_build_cloudflare_pages.py

      - name: Run Seo-gu G2-B reference clone renderer contract (#1303)
        run: python -m pytest -q tests/test_reference_clone_renderer.py

      - name: Run generic offline preview contract (#1232)
        run: python -m pytest -q tests/test_generic_offline_preview.py

      - name: Run CI job decomposition self-contract (#1231)
        run: python -m pytest -q tests/test_mvp_ci_job_decomposition.py

      - name: Run Python coverage baseline self-contract (#1231-G)
        run: python -m pytest -q tests/test_mvp_python_coverage_workflow.py

      - name: Check whitespace errors
        run: git diff --check

  cloudflare-function:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install Node test dependencies
        run: npm ci --ignore-scripts

      - name: Run Cloudflare MVP Function contract test
        env:
          RUN_CLOUDFLARE_FUNCTION_CONTRACTS: "1"
        run: node tests/functions/test_cloudflare_mvp_ask_contract.mjs

  citizen-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run MVP shell runtime harness
        run: node tests/browser/verify_mvp_shell_runtime.mjs

      - name: Install Node test dependencies
        run: npm ci --ignore-scripts

      - name: Run home fixture canvas browser contract (#1170)
        run: node tests/browser/verify_home_fixture_canvas_e2e.mjs

      - name: Run responsive browser contract
        run: node tests/browser/verify_first_use_responsive.mjs

      - name: Run entry chat space browser contract (#1190)
        run: node tests/browser/verify_entry_chat_space_e2e.mjs

      - name: Run decorative AI labels a11y browser contract (#1175)
        run: node tests/browser/verify_decorative_ai_labels_a11y.mjs

      - name: Run generic offline preview browser QA (#1232)
        run: node tests/browser/verify_generic_offline_preview_e2e.mjs

      - name: Run Seo-gu G2-B faithful clone browser QA (#1303)
        shell: bash
        run: |
          set -euo pipefail

          python scripts/build_reference_clone_site.py --out-dir /tmp/seogu-g2b

          python -m http.server 8771 \
            --bind 127.0.0.1 \
            --directory /tmp/seogu-g2b \
            > /tmp/seogu-g2b-server.log 2>&1 &

          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }

          trap cleanup EXIT

          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8771/"
          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("Seo-gu G2-B preview server did not become ready")
          PY

          node tests/browser/verify_seogu_reference_clone_e2e.mjs http://127.0.0.1:8771/

      - name: Run mobile multistep composer browser contract (#1174)
        run: node tests/browser/verify_mobile_multistep_composer_e2e.mjs

      - name: Run desktop chat scroll containment browser contract (#1173)
        run: node tests/browser/verify_desktop_chat_scroll_containment_e2e.mjs

      - name: Run mobile link safety browser contract (live build, port 8769)
        shell: bash
        run: |
          set -euo pipefail

          PYTHONPATH=. python scripts/build_cloudflare_pages.py --mode live

          python -m http.server 8769 \
            --bind 127.0.0.1 \
            --directory dist/cloudflare-pages \
            > /tmp/mobile-link-safety-server.log 2>&1 &

          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }

          trap cleanup EXIT

          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8769/mobile.html"

          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("mobile link safety server did not become ready")
          PY

          node tests/browser/verify_mobile_link_safety.mjs \
            http://127.0.0.1:8769/mobile.html

      - name: Run housing department browser contract
        shell: bash
        run: |
          set -euo pipefail

          python scripts/build_cloudflare_pages.py --mode live

          python -m http.server 8768 \
            --bind 127.0.0.1 \
            --directory dist/cloudflare-pages \
            > /tmp/housing-e2e-server.log 2>&1 &

          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }

          trap cleanup EXIT

          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8768/"

          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("housing E2E server did not become ready")
          PY

          node tests/browser/verify_housing_quest_e2e.mjs \
            http://127.0.0.1:8768

          node tests/browser/verify_mayor_writing_e2e.mjs \
            http://127.0.0.1:8768

          node tests/browser/verify_clone_header_list_containment.mjs \
            http://127.0.0.1:8768

      - name: Run two-stage bilingual draft browser contract
        run: node tests/browser/verify_two_stage_bilingual_draft_e2e.mjs

      - name: Prepare privacy-safe failure artifacts
        if: failure()
        run: python scripts/collect_mvp_failure_artifacts.py --job citizen-browser --out-dir /tmp/mvp-failure-artifacts-citizen-browser

      - name: Upload bounded failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mvp-failure-artifacts-citizen-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/mvp-failure-artifacts-citizen-browser
          retention-days: 5
          if-no-files-found: warn
  page-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install Node test dependencies
        run: npm ci --ignore-scripts

      - name: Run Page Agent lab Python contracts (full suite)
        run: python -m pytest -q tests/test_page_agent_lab.py

      - name: Run Page Agent schema safety contract (#1291)
        run: node --test tests/functions/test_page_agent_schema_safety_contract.mjs

      - name: Run Page Agent lab runtime verification
        run: node tests/browser/verify_page_agent_lab_runtime.mjs

      - name: Run Page Agent lab browser E2E
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          PYTHONPATH=. python scripts/build_cloudflare_pages.py --mode live

          test -f dist/cloudflare-pages/examples/page-agent/index.html
          test -f dist/cloudflare-pages/examples/page-agent/mock-model.js
          test -f dist/cloudflare-pages/examples/page-agent/page-agent-lab.js
          test -f dist/cloudflare-pages/examples/page-agent/vendor/page-agent.iife.js
          test -f dist/cloudflare-pages/examples/page-agent/vendor/LICENSE

          python -m http.server 8767 \
            --bind 127.0.0.1 \
            --directory dist/cloudflare-pages \
            > /tmp/page-agent-e2e-server.log 2>&1 &

          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }

          trap cleanup EXIT

          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8767/examples/page-agent/"

          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      body = response.read().decode("utf-8", errors="replace")
                      if response.status == 200 and "Local interoperability experiment" in body:
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              import sys
              try:
                  with open("/tmp/page-agent-e2e-server.log", "r") as f:
                      sys.stderr.write("--- Server log ---\n")
                      sys.stderr.write(f.read())
                      sys.stderr.write("--- End server log ---\n")
              except Exception as e:
                  sys.stderr.write("Could not read server log: " + str(e) + "\n")
              raise SystemExit("Page Agent E2E server did not become ready")
          PY

          node tests/browser/verify_page_agent_lab_e2e.mjs \
            http://127.0.0.1:8767

      - name: Run resident demo browser E2E
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          PYTHONPATH=. python scripts/build_cloudflare_pages.py --mode live

          test -f dist/cloudflare-pages/examples/page-agent/resident/index.html
          test -f dist/cloudflare-pages/examples/page-agent/resident/resident-mock-model.js
          test -f dist/cloudflare-pages/examples/page-agent/resident/resident-demo.js
          test -f dist/cloudflare-pages/examples/page-agent/resident/resident-demo.css
          test -f dist/cloudflare-pages/examples/page-agent/vendor/page-agent.iife.js
          test -f dist/cloudflare-pages/examples/page-agent/vendor/LICENSE

          python -m http.server 8766 \
            --bind 127.0.0.1 \
            --directory dist/cloudflare-pages \
            > /tmp/resident-e2e-server.log 2>&1 &

          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }

          trap cleanup EXIT

          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8766/examples/page-agent/resident/"

          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      body = response.read().decode("utf-8", errors="replace")
                      if response.status == 200 and "Page Agent형 AI 북구청" in body:
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              import sys
              try:
                  with open("/tmp/resident-e2e-server.log", "r") as f:
                      sys.stderr.write("--- Server log ---\n")
                      sys.stderr.write(f.read())
                      sys.stderr.write("--- End server log ---\n")
              except Exception as e:
                  sys.stderr.write("Could not read server log: " + str(e) + "\n")
              raise SystemExit("Resident E2E server did not become ready")
          PY

          node tests/browser/verify_resident_e2e.mjs \
            http://127.0.0.1:8766

      - name: Run mobile resident cancellation browser contract (#1183)
        run: node tests/browser/verify_mobile_resident_cancellation_e2e.mjs

      - name: Run resident mock model contract (unit-level)
        run: node tests/browser/verify_resident_mock_model.mjs

      - name: Run Page Agent production-gap browser contract
        run: node tests/browser/verify_page_agent_production_gaps_e2e.mjs

      - name: Prepare privacy-safe failure artifacts
        if: failure()
        run: python scripts/collect_mvp_failure_artifacts.py --job page-agent --out-dir /tmp/mvp-failure-artifacts-page-agent

      - name: Upload bounded failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mvp-failure-artifacts-page-agent-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/mvp-failure-artifacts-page-agent
          retention-days: 5
          if-no-files-found: warn
  comparison-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install Node test dependencies
        run: npm ci --ignore-scripts

      - name: Run Page Agent comparison contract tests (full suite)
        run: python -m pytest -q tests/test_page_agent_comparison_contract.py

      - name: Run Page Agent comparison evidence contract tests
        if: always()
        run: |
          python -m pytest -q tests/test_page_agent_comparison_evidence.py

      - name: Verify expectations fixture integrity
        run: |
          python - <<'PY'
          import json

          with open(
              "tests/fixtures/page_agent_comparison_expectations.json",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          assert data["schema_version"] == "1.0.0"
          assert len(data["scenarios"]) == 5

          for scenario in data["scenarios"]:
              assert "deterministic" in scenario
              assert "page_agent" in scenario
              assert "trigger" in scenario["deterministic"]
              assert "trigger" in scenario["page_agent"]

          base_sha = data["base_sha"]

          assert isinstance(base_sha, str)
          assert len(base_sha) == 40
          assert all(char in "0123456789abcdef" for char in base_sha)
          assert base_sha == "5ad20ad027f993cb522a49c90f39523211e6c5cd"

          print("Expectations fixture: OK")
          PY

      - name: Run Stage 3 browser comparison harness (static build, port 8765, 1 rep)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          PYTHONPATH=. python scripts/build_cloudflare_pages.py --mode static

          test -f dist/cloudflare-pages/examples/page-agent/resident/index.html
          test -f dist/cloudflare-pages/examples/page-agent/vendor/page-agent.iife.js
          test -f dist/cloudflare-pages/mvp/index.html

          python -m http.server 8765 \
            --bind 127.0.0.1 \
            --directory dist/cloudflare-pages \
            > /tmp/comparison-harness-server.log 2>&1 &

          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }

          trap cleanup EXIT

          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8765/examples/page-agent/resident/"

          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      body = response.read().decode("utf-8", errors="replace")
                      if response.status == 200 and "Page Agent형 AI 북구청" in body:
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              import sys
              try:
                  with open("/tmp/comparison-harness-server.log", "r") as f:
                      sys.stderr.write("--- Server log ---\n")
                      sys.stderr.write(f.read())
                      sys.stderr.write("--- End server log ---\n")
              except Exception as e:
                  sys.stderr.write("Could not read server log: " + str(e) + "\n")
              raise SystemExit("Comparison harness server did not become ready")
          PY

          node scripts/run_page_agent_comparison.mjs \
            --base-url http://127.0.0.1:8765 \
            --repetitions 1 \
            --output /tmp/comparison-evidence-ci.json

      - name: Verify Stage 3 evidence schema on CI-generated evidence (10 runs)
        if: always()
        run: |
          python - <<'PY'
          import json

          with open("/tmp/comparison-evidence-ci.json", encoding="utf-8") as f:
              data = json.load(f)

          assert data["schema_version"] == "1.0.0"

          runs = data["primary_runs"]
          assert len(runs) == 10, (
              "Expected 10 runs "
              f"(5 scenarios x 2 modes x 1 rep), got {len(runs)}"
          )

          for run in runs:
              label = (
                  f'{run["mode"]}/'
                  f'{run["scenario_id"]}/'
                  f'{run["attempt"]}'
              )

              assert run["external_request_count"] == 0, (
                  f"External request in {label}: "
                  f'{run["external_request_count"]}'
              )
              assert run["no_submit_preserved"] is True

              criteria = run.get("pass_criteria_results", [])
              assert criteria, (
                  f"Run {label} has empty pass_criteria_results"
              )

              for criterion in criteria:
                  assert "criterion" in criterion
                  assert "passed" in criterion

              sequence = run.get("action_sequence", [])
              if sequence:
                  if run["mode"] == "deterministic":
                      expected_count = len(
                          [
                              action
                              for action in sequence
                              if action not in ("message", "", "noop")
                          ]
                      )
                  else:
                      expected_count = len(
                          [
                              action
                              for action in sequence
                              if action not in ("done", "stop")
                          ]
                      )

                  assert run.get("action_step_count", 0) == expected_count, (
                      f'action_step_count '
                      f'{run.get("action_step_count")} '
                      f"!= expected count {expected_count} "
                      f'for mode {run["mode"]}'
                  )

          print(
              "Evidence schema OK: "
              f"{len(runs)} runs, 0 external requests, "
              "all no_submit preserved, "
              "all pass_criteria populated"
          )
          PY

      - name: Prepare privacy-safe failure artifacts
        if: failure()
        run: python scripts/collect_mvp_failure_artifacts.py --job comparison-evidence --out-dir /tmp/mvp-failure-artifacts-comparison-evidence

      - name: Upload bounded failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mvp-failure-artifacts-comparison-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/mvp-failure-artifacts-comparison-evidence
          retention-days: 5
          if-no-files-found: warn

  security-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install security CI tooling
        run: python -m pip install --disable-pip-version-check "ruff==0.16.2" "pip-audit==2.10.1"

      - name: Run security-quality contract tests
        run: |
          python -m pytest -q \
            tests/test_mvp_security_quality_workflow.py \
            tests/test_mvp_ci_job_decomposition.py \
            tests/test_mvp_failure_artifact_workflow.py

      - name: Run Ruff correctness gate
        run: ruff check --select E9,F63,F7,F82 --output-format=github .

      - name: Scan repository secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Audit locked Python dependencies
        run: python -m pip_audit --strict --no-deps --disable-pip -r requirements.txt

      - name: Install Node dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit locked Node dependencies
        run: npm audit --audit-level=low

  python-coverage-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install coverage baseline tooling
        run: python -m pip install --disable-pip-version-check -r requirements-ci-coverage.txt

      - name: Run deterministic Python src line-coverage baseline
        run: python scripts/run_mvp_python_coverage_baseline.py --output /tmp/mvp-python-coverage-baseline.json

  mvp-contracts:
    if: always()
    needs:
      - python-contracts

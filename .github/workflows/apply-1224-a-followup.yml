name: Apply 1224-A follow-up

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-1224-a-followup:
    if: github.event.pull_request.head.ref == 'feat/1224-request-privacy-boundary'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1224-request-privacy-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply follow-up anchors
        run: python scripts/apply_1224_a_followup.py
      - name: Syntax checks
        run: |
          node --check functions/api/mvp/request-safety.js
          node --check functions/api/mvp/ask.js
          node --check src/web/static/citizen-mvp-bridge.js
          node --check tests/functions/test_cloudflare_mvp_request_safety_contract.mjs
          node --check tests/functions/test_citizen_mvp_bridge_session_contract.mjs
          node --check tests/functions/test_cloudflare_mvp_ask_contract.mjs
      - name: Run focused safety contracts
        run: |
          node tests/functions/test_cloudflare_mvp_request_safety_contract.mjs
          node tests/functions/test_citizen_mvp_bridge_session_contract.mjs
      - name: Run full Function contracts
        env:
          RUN_CLOUDFLARE_FUNCTION_CONTRACTS: '1'
        run: node tests/functions/test_cloudflare_mvp_ask_contract.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit validated follow-up changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            functions/api/mvp/ask.js \
            functions/api/mvp/request-safety.js \
            src/web/static/citizen-mvp-bridge.js \
            tests/functions/test_cloudflare_mvp_ask_contract.mjs \
            tests/functions/test_cloudflare_mvp_request_safety_contract.mjs \
            tests/functions/test_citizen_mvp_bridge_session_contract.mjs
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
            exit 0
          fi
          git commit -m 'feat(mvp): complete anonymous request privacy boundary (#1224)'
          git push origin HEAD:feat/1224-request-privacy-boundary

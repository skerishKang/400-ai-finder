name: Apply 1224-B scroll quiescence synchronization

on:
  push:
    branches: [feat/1224-turnstile-bot-defense]

permissions:
  contents: write

jobs:
  apply-scroll-quiescence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1224-turnstile-bot-defense
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply frame-synchronized scroll harness fix
        run: python scripts/apply_1224_b_scroll_quiescence.py
      - name: Remove temporary applicator files
        run: |
          rm .github/workflows/apply-1224-b-scroll-quiescence.yml
          rm scripts/apply_1224_b_scroll_quiescence.py
      - name: Install Node test dependencies
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: node --check tests/browser/verify_desktop_chat_scroll_containment_e2e.mjs
      - name: Run desktop scroll containment E2E
        run: node tests/browser/verify_desktop_chat_scroll_containment_e2e.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit validated synchronization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(web): synchronize history-scroll probe after auto-scroll (#1224)'
          git push origin HEAD:feat/1224-turnstile-bot-defense

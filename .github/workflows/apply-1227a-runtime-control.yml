name: Apply 1227A runtime control patch

on:
  push:
    branches:
      - feat/1227-runtime-control-foundation
    paths:
      - '.github/workflows/apply-1227a-runtime-control.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/feat/1227-runtime-control-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/1227a.patch.b64.* | base64 --decode > /tmp/1227a.patch
          git apply --check /tmp/1227a.patch
          git apply /tmp/1227a.patch
          node --check functions/api/mvp/ask.js
          node --check tests/functions/test_cloudflare_mvp_ask_contract.mjs
          RUN_CLOUDFLARE_FUNCTION_CONTRACTS=1 node tests/functions/test_cloudflare_mvp_ask_contract.mjs

      - name: Commit validated change and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .automation
          rm -f .github/workflows/apply-1227a-runtime-control.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            functions/api/mvp/ask.js \
            tests/functions/test_cloudflare_mvp_ask_contract.mjs \
            .automation \
            .github/workflows/apply-1227a-runtime-control.yml
          git diff --cached --check
          git commit -m 'feat(mvp): add runtime request controls (#1227)'
          git push origin "HEAD:${GITHUB_REF_NAME}"

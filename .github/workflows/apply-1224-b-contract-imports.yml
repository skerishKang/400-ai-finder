name: Apply 1224-B Turnstile contract imports

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-1224-b-contracts:
    if: github.event.pull_request.head.ref == 'feat/1224-turnstile-bot-defense'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1224-turnstile-bot-defense
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact contract import anchor
        run: python scripts/apply_1224_b_contract_imports.py
      - name: Syntax checks
        run: |
          node --check functions/api/mvp/turnstile.js
          node --check functions/api/mvp/turnstile-config.js
          node --check functions/api/mvp/request-safety.js
          node --check functions/api/mvp/ask.js
          node --check src/web/static/citizen-turnstile.js
          node --check src/web/static/citizen-mvp-bridge.js
          node --check tests/functions/test_cloudflare_mvp_turnstile_contract.mjs
          node --check tests/functions/test_cloudflare_mvp_turnstile_integration_contract.mjs
          node --check tests/functions/test_citizen_mvp_turnstile_contract.mjs
          node --check tests/functions/test_citizen_mvp_bridge_session_contract.mjs
          node --check tests/functions/test_cloudflare_mvp_ask_contract.mjs
      - name: Run Turnstile focused contracts
        run: |
          node tests/functions/test_cloudflare_mvp_turnstile_contract.mjs
          node tests/functions/test_cloudflare_mvp_turnstile_integration_contract.mjs
          node tests/functions/test_citizen_mvp_turnstile_contract.mjs
      - name: Run anonymous-session contract
        run: node tests/functions/test_citizen_mvp_bridge_session_contract.mjs
      - name: Run request/privacy contract
        run: node tests/functions/test_cloudflare_mvp_request_safety_contract.mjs
      - name: Run complete Cloudflare Function contract entrypoint
        env:
          RUN_CLOUDFLARE_FUNCTION_CONTRACTS: '1'
        run: node tests/functions/test_cloudflare_mvp_ask_contract.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit validated contract imports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/functions/test_cloudflare_mvp_ask_contract.mjs
          if git diff --cached --quiet; then
            echo 'No contract import changes to commit'
            exit 0
          fi
          git commit -m 'test(mvp): wire Turnstile contracts into Function gate (#1224)'
          git push origin HEAD:feat/1224-turnstile-bot-defense

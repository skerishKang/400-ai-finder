name: Apply 1224-A contract closeout

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.pull_request.head.ref == 'feat/1224-request-privacy-boundary'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1224-request-privacy-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install focused Python test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Apply contract closeout anchors
        run: python scripts/apply_1224_a_contract_closeout.py
      - name: Syntax checks
        run: |
          node --check functions/api/mvp/ask.js
          node --check functions/api/mvp/request-safety.js
          node --check src/web/static/citizen-mvp-bridge.js
          node --check tests/functions/test_cloudflare_mvp_request_safety_contract.mjs
          node --check tests/functions/test_citizen_mvp_bridge_session_contract.mjs
          node --check tests/functions/test_cloudflare_mvp_ask_contract.mjs
      - name: Run focused privacy contracts
        run: |
          node tests/functions/test_cloudflare_mvp_request_safety_contract.mjs
          node tests/functions/test_citizen_mvp_bridge_session_contract.mjs
      - name: Run full Function contracts
        env:
          RUN_CLOUDFLARE_FUNCTION_CONTRACTS: '1'
        run: node tests/functions/test_cloudflare_mvp_ask_contract.mjs
      - name: Run canonical clone-doc contract
        run: python -m pytest -q tests/test_exact_official_site_clone_invariant.py
      - name: Diff check
        run: git diff --check
      - name: Commit validated contract closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            functions/api/mvp/ask.js \
            tests/functions/test_cloudflare_mvp_request_safety_contract.mjs \
            docs/operations/MVP_AI_RUNTIME_CONTRACT.md \
            docs/operations/PUBLIC_AI_API_SECURITY_AND_PRIVACY.md
          git commit -m 'docs(mvp): close request privacy runtime contract (#1224)'
          git push origin HEAD:feat/1224-request-privacy-boundary

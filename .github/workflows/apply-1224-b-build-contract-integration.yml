name: Apply 1224-B build contract integration

on:
  push:
    branches: [feat/1224-turnstile-bot-defense]

permissions:
  contents: write

jobs:
  integrate-build-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1224-turnstile-bot-defense
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Integrate contract into CI-owned build test file
        run: python scripts/apply_1224_b_build_contract_integration.py
      - name: Remove standalone and temporary applicator files
        run: |
          rm -f tests/test_mvp_turnstile_build_contract.py
          rm .github/workflows/apply-1224-b-build-contract-integration.yml
          rm scripts/apply_1224_b_build_contract_integration.py
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run CI-owned build contract suite
        run: python -m pytest -q tests/test_build_cloudflare_pages.py
      - name: Diff check
        run: git diff --check
      - name: Commit validated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(mvp): cover Turnstile assets in Pages build suite (#1224)'
          git push origin HEAD:feat/1224-turnstile-bot-defense

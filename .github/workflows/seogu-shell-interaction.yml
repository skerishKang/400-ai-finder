name: Seo-gu Shell Interaction Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  seogu-shell-gnb:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install Node test dependencies
        run: npm ci --ignore-scripts

      - name: Run Seo-gu shell GNB interaction contract (#1343)
        shell: bash
        run: |
          set -euo pipefail

          PYTHONPATH=. python scripts/build_cloudflare_pages.py --mode live

          python -m http.server 8772 \
            --bind 127.0.0.1 \
            --directory dist/cloudflare-pages \
            > /tmp/seogu-shell-gnb-server.log 2>&1 &

          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }

          trap cleanup EXIT

          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8772/static/municipal-ai-shell.html?site_id=seogu_gwangju"
          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("Seo-gu shell interaction server did not become ready")
          PY

          node tests/browser/verify_seogu_shell_gnb_interaction_e2e.mjs \
            http://127.0.0.1:8772

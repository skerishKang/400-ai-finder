name: Apply 1224-B Page Agent MVP Turnstile isolation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/1224-turnstile-bot-defense]

permissions:
  contents: write

jobs:
  apply-page-agent-turnstile:
    if: github.head_ref == 'feat/1224-turnstile-bot-defense' || github.ref == 'refs/heads/feat/1224-turnstile-bot-defense'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1224-turnstile-bot-defense
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact Page Agent MVP Turnstile isolation
        run: python scripts/apply_1224_b_page_agent_mvp_turnstile_stub.py
      - name: Remove temporary applicator files
        run: |
          rm .github/workflows/apply-1224-b-page-agent-turnstile.yml
          rm scripts/apply_1224_b_page_agent_mvp_turnstile_stub.py
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm ci --ignore-scripts
      - name: Syntax check
        run: node --check tests/browser/verify_page_agent_production_gaps_e2e.mjs
      - name: Run Page Agent production-gap browser contract
        run: node tests/browser/verify_page_agent_production_gaps_e2e.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit validated isolation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(web): isolate Page Agent MVP mock from Turnstile lifecycle (#1224)'
          git push origin HEAD:feat/1224-turnstile-bot-defense

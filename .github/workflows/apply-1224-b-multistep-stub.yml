name: Apply 1224-B multistep Turnstile isolation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-1224-b-multistep-stub:
    if: github.event.pull_request.head.ref == 'feat/1224-turnstile-bot-defense'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1224-turnstile-bot-defense
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact multistep harness anchor
        run: python scripts/apply_1224_b_multistep_turnstile_stub.py
      - name: Install Node test dependencies
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: node --check tests/browser/verify_mobile_multistep_composer_e2e.mjs
      - name: Run mobile multistep composer E2E
        run: node tests/browser/verify_mobile_multistep_composer_e2e.mjs
      - name: Run Turnstile browser contract
        run: node tests/functions/test_citizen_mvp_turnstile_contract.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit validated harness isolation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/verify_mobile_multistep_composer_e2e.mjs
          if git diff --cached --quiet; then
            echo 'No multistep harness change to commit'
            exit 0
          fi
          git commit -m 'test(web): isolate multistep E2E from Turnstile lifecycle (#1224)'
          git push origin HEAD:feat/1224-turnstile-bot-defense

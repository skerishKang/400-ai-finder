name: Apply 1227-C validated patch

on:
  push:
    branches: [feat/1227-token-usage-telemetry]
    paths:
      - '.automation/1227-c-token-usage.patch'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact validated patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .automation/1227-c-token-usage.patch
          git apply .automation/1227-c-token-usage.patch
      - name: Validate function contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/api/mvp/ask.js
          node --check tests/functions/test_cloudflare_mvp_ask_contract.mjs
          RUN_CLOUDFLARE_FUNCTION_CONTRACTS=1 node tests/functions/test_cloudflare_mvp_ask_contract.mjs
          git diff --check
      - name: Commit product changes and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -f .automation/1227-c-token-usage.patch .github/workflows/apply-1227-c.yml
          rmdir .automation 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/mvp/ask.js tests/functions/test_cloudflare_mvp_ask_contract.mjs
          git add -u .automation .github/workflows/apply-1227-c.yml || true
          git diff --cached --check
          git commit -m 'feat(mvp): add provider token telemetry (#1227)'
          git push origin HEAD:feat/1227-token-usage-telemetry

name: Apply 1224-B scroll Turnstile isolation

on:
  push:
    branches: [feat/1224-turnstile-bot-defense]

permissions:
  contents: write

jobs:
  apply-1224-b-scroll-stub:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1224-turnstile-bot-defense
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Integrate latest authoritative main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
      - name: Apply exact scroll-harness isolation
        run: python scripts/apply_1224_b_scroll_turnstile_stub.py
      - name: Remove temporary applicator files
        run: |
          rm .github/workflows/apply-1224-b-scroll-stub.yml
          rm scripts/apply_1224_b_scroll_turnstile_stub.py
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install Node test dependencies
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: node --check tests/browser/verify_desktop_chat_scroll_containment_e2e.mjs
      - name: Run desktop scroll containment E2E
        run: node tests/browser/verify_desktop_chat_scroll_containment_e2e.mjs
      - name: Run dedicated Turnstile browser contract
        run: node tests/functions/test_citizen_mvp_turnstile_contract.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit validated isolation and latest-main integration
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'No change to commit'
            exit 0
          fi
          git commit -m 'test(web): isolate scroll E2E from Turnstile lifecycle (#1224)'
          git push origin HEAD:feat/1224-turnstile-bot-defense

name: Apply 1224-A validated patch

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-1224-a:
    if: github.event.pull_request.head.ref == 'feat/1224-request-privacy-boundary'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1224-request-privacy-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact anchors
        run: python scripts/apply_1224_a.py
      - name: Syntax checks
        run: |
          node --check functions/api/mvp/request-safety.js
          node --check functions/api/mvp/ask.js
          node --check tests/functions/test_cloudflare_mvp_request_safety_contract.mjs
          node --check tests/functions/test_cloudflare_mvp_ask_contract.mjs
      - name: Run request/privacy contract
        run: node tests/functions/test_cloudflare_mvp_request_safety_contract.mjs
      - name: Run full Function contract
        env:
          RUN_CLOUDFLARE_FUNCTION_CONTRACTS: '1'
        run: node tests/functions/test_cloudflare_mvp_ask_contract.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit validated product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            functions/api/mvp/ask.js \
            functions/api/mvp/request-safety.js \
            tests/functions/test_cloudflare_mvp_ask_contract.mjs \
            tests/functions/test_cloudflare_mvp_request_safety_contract.mjs \
            .env.example
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
            exit 0
          fi
          git commit -m 'feat(mvp): enforce request privacy boundary (#1224)'
          git push origin HEAD:feat/1224-request-privacy-boundary

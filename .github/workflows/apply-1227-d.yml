name: Apply 1227-D validated patch

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/1227-browser-request-identity' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1227-browser-request-identity
          fetch-depth: 0
      - name: Apply exact validated patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .automation/1227-d-browser-request-identity.patch
          git apply .automation/1227-d-browser-request-identity.patch
      - name: Validate bridge contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/web/static/citizen-mvp-bridge.js
          node --check tests/browser/verify_mvp_bridge_request_identity.mjs
          node --check tests/browser/verify_mvp_shell_runtime.mjs
          node tests/browser/verify_mvp_bridge_request_identity.mjs
          node tests/browser/verify_mvp_shell_runtime.mjs
          git diff --check
      - name: Commit product changes and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -f .automation/1227-d-browser-request-identity.patch .github/workflows/apply-1227-d.yml
          rmdir .automation 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web/static/citizen-mvp-bridge.js tests/browser/verify_mvp_bridge_request_identity.mjs tests/browser/verify_mvp_shell_runtime.mjs
          git add -u .automation .github/workflows/apply-1227-d.yml || true
          git diff --cached --check
          git commit -m 'feat(web): correlate MVP request identity (#1227)'
          git push origin HEAD:feat/1227-browser-request-identity

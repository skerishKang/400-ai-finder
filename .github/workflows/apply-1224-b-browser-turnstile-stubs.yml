name: Apply 1224-B remaining browser Turnstile stubs

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/1224-turnstile-bot-defense]

permissions:
  contents: write

jobs:
  apply-browser-turnstile-stubs:
    if: github.head_ref == 'feat/1224-turnstile-bot-defense' || github.ref == 'refs/heads/feat/1224-turnstile-bot-defense'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1224-turnstile-bot-defense
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact offline Turnstile stubs
        run: python scripts/apply_1224_b_remaining_browser_turnstile_stubs.py
      - name: Remove temporary applicator files
        run: |
          rm .github/workflows/apply-1224-b-browser-turnstile-stubs.yml
          rm scripts/apply_1224_b_remaining_browser_turnstile_stubs.py
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm ci --ignore-scripts
      - name: Syntax check
        run: |
          node --check tests/browser/verify_housing_quest_e2e.mjs
          node --check tests/browser/verify_mayor_writing_e2e.mjs
          node --check tests/browser/verify_two_stage_bilingual_draft_e2e.mjs
      - name: Build live Pages fixture
        run: PYTHONPATH=. python scripts/build_cloudflare_pages.py --mode live
      - name: Run housing and mayor browser contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8768 --bind 127.0.0.1 --directory dist/cloudflare-pages > /tmp/turnstile-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(40):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8768/', timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit('browser fixture server did not become ready')
          PY
          node tests/browser/verify_housing_quest_e2e.mjs http://127.0.0.1:8768
          node tests/browser/verify_mayor_writing_e2e.mjs http://127.0.0.1:8768
      - name: Run two-stage bilingual draft browser contract
        run: node tests/browser/verify_two_stage_bilingual_draft_e2e.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit validated browser isolation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(web): isolate remaining MVP E2E from Turnstile lifecycle (#1224)'
          git push origin HEAD:feat/1224-turnstile-bot-defense

name: Apply 1224-B Turnstile server wiring

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-1224-b-server:
    if: github.event.pull_request.head.ref == 'feat/1224-turnstile-bot-defense'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1224-turnstile-bot-defense
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact server anchors
        run: python scripts/apply_1224_b_server.py
      - name: Syntax checks
        run: |
          node --check functions/api/mvp/turnstile.js
          node --check functions/api/mvp/turnstile-config.js
          node --check functions/api/mvp/request-safety.js
          node --check functions/api/mvp/ask.js
          node --check tests/functions/test_cloudflare_mvp_turnstile_contract.mjs
          node --check tests/functions/test_cloudflare_mvp_ask_contract.mjs
      - name: Run focused Turnstile contracts
        run: node tests/functions/test_cloudflare_mvp_turnstile_contract.mjs
      - name: Run full Function contracts
        env:
          RUN_CLOUDFLARE_FUNCTION_CONTRACTS: '1'
        run: node tests/functions/test_cloudflare_mvp_ask_contract.mjs
      - name: Run request/privacy contracts
        run: node tests/functions/test_cloudflare_mvp_request_safety_contract.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit validated server wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            functions/api/mvp/ask.js \
            functions/api/mvp/request-safety.js \
            tests/functions/test_cloudflare_mvp_ask_contract.mjs
          if git diff --cached --quiet; then
            echo 'No server wiring changes to commit'
            exit 0
          fi
          git commit -m 'feat(mvp): wire Turnstile verification boundary (#1224)'
          git push origin HEAD:feat/1224-turnstile-bot-defense

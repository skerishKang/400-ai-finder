<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  seogu-citizen-action-demo.html
  Seo-gu (서구) MVP first screen — Buk-gu parity slice (#1343 / #1349).

  REUSE CONTRACT:
  - The shell STRUCTURE and VISUALS are the Buk-gu canonical resident shell.
  - We load the SAME Buk-gu shell CSS so the layout is genuinely the Buk-gu
    resident shell, not a generic restyle.
  - Seo-gu-specific visible identity/content remains in this site-specific file.
  - Shared shell/runtime code must not branch on raw Seo-gu site ids.
-->
<title>서구청 AI 민원 네비게이터</title>
<link rel="stylesheet" href="/static/citizen-shared-tokens.css">
<link rel="stylesheet" href="/static/citizen-copilot-shell.css">
<link rel="stylesheet" href="/static/citizen-action-demo-canvas.css">
<link rel="stylesheet" href="/static/citizen-first-use-shell.css">
<link rel="stylesheet" href="/static/seogu-citizen-action-demo.css">
</head>
<body data-first-use-state="entry" data-site-id="seogu_gwangju">
<div class="first-use-layout" id="first-use-layout">
<section class="entry-stage" aria-hidden="true">
  <div class="entry-stage__aurora entry-stage__aurora--one"></div>
  <div class="entry-stage__aurora entry-stage__aurora--two"></div>

  <div class="entry-stage__brand entry-stage__brand--seogu">
    <span class="entry-stage__brand-mark" aria-hidden="true">서구</span>
    <span class="entry-stage__brand-copy">
      <strong>함께 서구 · 우뚝서구</strong>
      <small>AI 행정 브라우저</small>
    </span>
  </div>

  <div class="entry-stage__copy">
    <span class="entry-stage__eyebrow"><i></i> SEOGU AI CIVIC NAVIGATOR</span>
    <h1>서구의 모든 행정,<br /><em>한 문장으로.</em></h1>
    <p>찾고, 클릭하고, 작성하는 과정까지 AI가 주민과 함께합니다.</p>
    <div class="entry-stage__capabilities">
      <span>FIND</span><b>찾고</b>
      <span>ACT</span><b>움직이고</b>
      <span>WRITE</span><b>작성합니다</b>
    </div>
  </div>

  <!--
    #1349 S0: populate the canonical Buk-gu hero figure slot with a truthful,
    local-only Seo-gu civic profile card. Copy is taken from the committed
    Seo-gu source capture; no fabricated official image/logo and no hotlink.
  -->
  <figure class="entry-stage__mayor entry-stage__mayor--seogu">
    <div class="entry-stage__mayor-orbit"></div>
    <div class="seogu-entry-profile-card">
      <div class="seogu-entry-profile-card__top">
        <span class="seogu-entry-profile-card__kicker">#착한도시 서구</span>
        <span class="seogu-entry-profile-card__badge">SEO-GU</span>
      </div>

      <div class="seogu-entry-profile-card__identity">
        <span>전남광주통합특별시 서구</span>
        <strong><em>김이강</em> 서구청장 입니다.</strong>
      </div>

      <div class="seogu-entry-profile-card__links">
        <span>내곁에 구청장실</span>
        <span>매니페스토 (공약)</span>
      </div>

      <div class="seogu-entry-profile-card__skyline" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i>
      </div>

      <div class="seogu-entry-profile-card__footer">함께 서구 · 우뚝서구</div>
    </div>
    <figcaption>
      <span>SEOGU VISION</span>
      <strong>주민이 체감하는 AI 행정</strong>
    </figcaption>
  </figure>

  <div class="entry-stage__signal"><i></i> AI AGENT READY</div>
</section>

<!-- Mobile surface switch: conversation / guidance. Hidden on desktop. -->
<div class="mobile-surface-switch" id="mobile-surface-switch" role="group" aria-label="서비스 화면" hidden>
  <button class="mobile-surface-tab" id="tab-conversation" type="button" aria-pressed="true" aria-controls="chat-shell" data-mobile-surface-tab="conversation">
    대화
  </button>
  <button class="mobile-surface-tab" id="tab-guidance" type="button" aria-pressed="false" aria-controls="demo-canvas" data-mobile-surface-tab="guidance">
    안내 화면
  </button>
</div>

<aside class="chat-shell" id="chat-shell" role="complementary" aria-label="AI 민원 네비게이터" aria-busy="false">
  <div class="chat-shell__header">
    <div class="chat-shell__header-main">
      <div class="chat-shell__title-row">
        <span class="chat-shell__title" id="chat-title">AI 민원 네비게이터</span>
      </div>
      <p class="chat-shell__attribution" data-service-attribution="padiem-compact">AI Agent by PADIEM</p>
    </div>
    <div class="chat-shell__header-tools">
      <button class="chat-shell__reset" id="chat-reset" type="button" hidden>
        새로 시작
      </button>
    </div>
  </div>

  <p id="chat-journey-status" class="chat-shell__journey-status" role="status" aria-live="polite" aria-atomic="true"></p>

  <div class="chat-thread" id="chat-thread" aria-live="polite">
    <div class="chat-msg chat-msg--ai">
      <div class="chat-avatar" aria-hidden="true">A</div>
      <div class="chat-bubble chat-bubble--ai" id="chat-greeting"></div>
    </div>
  </div>

  <!-- Resident-task chips are rendered from SeoguResidentJourneyRegistry (site config). -->
  <div class="chat-chips" id="chat-chips" role="group" aria-label="추천 질문"></div>

  <form class="chat-composer" id="chat-composer-form" autocomplete="off">
    <div class="chat-composer__row">
      <input
        class="chat-composer__input"
        id="chat-composer-input"
        type="text"
        placeholder="여기에 물어보세요"
        aria-label="메시지 입력"
      />
      <button class="chat-composer__send" id="chat-composer-send" type="submit" aria-label="보내기">
        보내기
      </button>
    </div>
    <div class="chat-composer__utility">
      <p class="chat-composer__hint" id="composer-hint">첫 질문 후 서구청 안내 화면과 함께 경로를 보여드립니다.</p>
      <span id="chat-recommendations-toggle-mount" class="chat-composer__utility-mount"></span>
    </div>
    <p id="chat-privacy-warning" class="chat-composer__privacy-warning" role="note"></p>
  </form>

  <p class="chat-shell__disclosure" data-service-attribution="padiem-disclosure" role="note"
     id="shell-disclosure"></p>
</aside>

<!-- Seo-gu bounded same-origin READ surface (reuses MunicipalCloneSurface). -->
<main class="demo-canvas" id="demo-canvas" role="main" aria-label="서구청 안내 화면" aria-hidden="true" inert>
  <div class="demo-canvas__inner">
    <iframe
      id="seogu-clone-frame"
      class="seogu-clone-frame"
      title="서구청 안내 화면"
      sandbox="allow-same-origin"
      referrerpolicy="no-referrer"
    ></iframe>
    <div class="demo-canvas__loading" id="demo-canvas-loading" aria-live="polite"></div>
  </div>
</main>
<div class="first-use-layout__spacer" aria-hidden="true"></div>
</div>

<script>
  (function () {
    if (window.location.search.indexOf("review=true") !== -1) {
      document.body.classList.add("review-mode");
    }
  })();
</script>

<!-- Shared, site-parameterized machinery -->
<script src="/static/municipal-site-surface-registry.js"></script>
<script src="/static/municipal-clone-surface.js"></script>
<script src="/static/municipal-resident-journey.js"></script>
<script src="/static/municipal-resident-journey-registry.js"></script>
<script src="/static/citizen-mvp-bridge.js"></script>
<!-- Seo-gu site-specific data/config island -->
<script src="/static/seogu-sitespec-metadata.js"></script>
<script src="/static/seogu-resident-journey-registry.js"></script>
<!-- Seo-gu orchestration: wires chips → journeys → clone READ, reusing shared modules -->
<script src="/static/seogu-citizen-action-shell.js"></script>
</body>
</html>
